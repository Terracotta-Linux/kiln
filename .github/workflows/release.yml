name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            pacman bubblewrap ostree dracut grub git \
            cargo glib2 pkgconf sudo

      - name: Create unprivileged build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package with makepkg
        run: |
          su builder -c "cd '$GITHUB_WORKSPACE/packaging' && makepkg --syncdeps --noconfirm --skippgpcheck --nocheck"

      - name: Rename package and compute checksum
        id: pkg
        run: |
          cd packaging
          built=$(ls -- *.pkg.tar.zst | head -n1)
          arch=$(echo "$built" | rev | cut -d- -f1 | rev | sed 's/\.pkg\.tar\.zst$//')
          pkgfile="terracotta-kiln-${arch}.pkg.tar.zst"
          mv -- "$built" "$pkgfile"
          sha256sum "$pkgfile" > "$pkgfile.sha256"
          echo "pkgfile=$pkgfile" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packaging/${{ steps.pkg.outputs.pkgfile }}
            packaging/${{ steps.pkg.outputs.pkgfile }}.sha256
