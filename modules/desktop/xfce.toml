# Xfce with the full xfce4 and xfce4-goodies groups: every companion app and
# panel plugin, on top of @kiln/desktop/xfce-minimal's bare session. There is
# no xfce-full — this already is everything both groups ship (rule 1).
# libalpm resolves package names, not group names, so both are listed here.
kiln = 1

[packages]
repo = [
  "exo", "garcon", "mousepad", "parole", "ristretto", "thunar", "thunar-archive-plugin",
  "thunar-media-tags-plugin", "thunar-volman", "tumbler", "xfburn", "xfce4-appfinder", "xfce4-battery-plugin", "xfce4-clipman-plugin",
  "xfce4-cpufreq-plugin", "xfce4-cpugraph-plugin", "xfce4-dict", "xfce4-diskperf-plugin", "xfce4-eyes-plugin", "xfce4-fsguard-plugin", "xfce4-genmon-plugin",
  "xfce4-mailwatch-plugin", "xfce4-mount-plugin", "xfce4-mpc-plugin", "xfce4-netload-plugin", "xfce4-notes-plugin", "xfce4-notifyd", "xfce4-panel",
  "xfce4-places-plugin", "xfce4-power-manager", "xfce4-pulseaudio-plugin", "xfce4-screensaver", "xfce4-screenshooter", "xfce4-sensors-plugin", "xfce4-session",
  "xfce4-settings", "xfce4-smartbookmark-plugin", "xfce4-systemload-plugin", "xfce4-taskmanager", "xfce4-terminal", "xfce4-time-out-plugin", "xfce4-timer-plugin",
  "xfce4-verve-plugin", "xfce4-wavelan-plugin", "xfce4-weather-plugin", "xfce4-whiskermenu-plugin", "xfce4-xkb-plugin", "xfconf", "xfdesktop",
  "xfwm4", "lightdm", "lightdm-gtk-greeter",
]

[systemd]
enable = ["lightdm.service"]
