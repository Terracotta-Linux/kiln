# Plasma's session and portal, plus a normal desktop's apps: a terminal, a
# calculator, and a system info panel. See @kiln/desktop/plasma-minimal for
# essentials only, and plasma-full for plasma-meta, KDE's "everything"
# package.
kiln = 1

[packages]
repo = [
  "plasma-desktop", "plasma-login-manager", "xdg-desktop-portal-kde",
  "konsole", "kcalc", "kinfocenter",
]

[systemd]
enable = ["plasmalogin.service"]
