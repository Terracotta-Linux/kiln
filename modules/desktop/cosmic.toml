# COSMIC with the whole cosmic group: the file manager, terminal, text
# editor, app store, and every settings and panel piece beyond
# @kiln/desktop/cosmic-minimal's bare session. There is no cosmic-full —
# this already is everything System76 ships under the group (rule 1).
# libalpm resolves package names, not group names, so its members are
# listed here individually.
kiln = 1

[packages]
repo = [
  "cosmic-app-library", "cosmic-applets", "cosmic-bg", "cosmic-comp",
  "cosmic-files", "cosmic-greeter", "cosmic-idle", "cosmic-initial-setup",
  "cosmic-launcher", "cosmic-monitor", "cosmic-notifications", "cosmic-osd",
  "cosmic-panel", "cosmic-player", "cosmic-randr", "cosmic-screenshot",
  "cosmic-session", "cosmic-settings", "cosmic-settings-daemon",
  "cosmic-sound-theme", "cosmic-store", "cosmic-terminal",
  "cosmic-text-editor", "cosmic-wallpapers", "cosmic-workspaces",
  "xdg-desktop-portal-cosmic",
]

[systemd]
enable = ["cosmic-greeter.service"]
