# NVIDIA's open kernel modules, prebuilt against `linux` (@kiln/kernel/linux).
#
# `nvidia-open`, not `nvidia-open-dkms`: the prebuilt package is the same driver
# with the compile already done, which is what an image wants. Where Arch ships
# no prebuilt module for the kernel you run — linux-zen, linux-hardened,
# linux-rt — @kiln/gpu/nvidia-open-dkms builds one. On @kiln/kernel/linux-lts
# use @kiln/gpu/nvidia-open-lts.
kiln = 1

[packages]
repo = ["nvidia-open", "nvidia-utils"]

[kernel]
cmdline = ["nvidia_drm.modeset=1"]

[kernel.modules]
blacklist = ["nouveau"]
